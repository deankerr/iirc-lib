pre-commit:
  jobs:
    - run: bun run fix
      glob:
        - '**/*.cjs'
        - '**/*.cts'
        - '**/*.css'
        - '**/*.graphql'
        - '**/*.html'
        - '**/*.js'
        - '**/*.jsx'
        - '**/*.json'
        - '**/*.jsonc'
        - '**/*.json5'
        - '**/*.less'
        - '**/*.md'
        - '**/*.mdx'
        - '**/*.mjs'
        - '**/*.mts'
        - '**/*.sass'
        - '**/*.scss'
        - '**/*.ts'
        - '**/*.tsx'
        - '**/*.yaml'
        - '**/*.yml'
      stage_fixed: true
